<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin – Mahindra Modi Accessories (private)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=Lato:wght@700;900&display=swap">
<style>
:root{--bg:#050506;--surface:#0f1013;--surface2:#17191d;--ink:#f4f5f7;--muted:#9aa0ab;--line:#2a2d34;--red:#ff4452;--red-fill:#b80f26;--green:#37e98c;--green-fill:#0b8a47;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 380px at 50% -140px,#1b1e25 0%,rgba(5,5,6,0) 70%) no-repeat,var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,sans-serif;border-top:5px solid var(--red-fill)}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.brandrow{display:flex;align-items:center;gap:12px}.brandrow img{height:38px;width:auto}
header b{font-family:Lato,sans-serif;font-weight:900;font-size:20px}
header small{display:block;color:var(--muted);font-size:12px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;margin:0;line-height:1}
h2{font-size:32px;margin-bottom:6px} h3{font-size:22px;margin-bottom:10px}
p.hint{color:var(--muted);margin:4px 0 14px;font-size:14px}
button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:6px;padding:9px 14px;font-weight:600;text-decoration:none;display:inline-block}
button.pri{background:linear-gradient(180deg,#d4172f,var(--red-fill));box-shadow:inset 0 1px 0 #ffffff30;border-color:var(--red-fill);color:#fff}
button.danger{color:#ff8a93;border-color:#5a1f26}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs button[aria-pressed="true"]{background:var(--red-fill);border-color:var(--red-fill);color:#fff}
.card{background:linear-gradient(180deg,#14161a,var(--surface));border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px;color:#d6d6da}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:11px 12px;font:inherit;font-size:16px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.item{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.item img{width:84px;height:56px;object-fit:cover;border-radius:4px;background:#000;flex:none}
.item .mid{flex:1;min-width:150px}
.item .t{font-weight:600}.item .s{color:var(--muted);font-size:13px}
.chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);margin-right:6px}
.live{color:#2ee66b;border-color:#14502c}.sched{color:#ffc857;border-color:#5a4a14}.exp,.hid{color:var(--muted)}
.prev{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.prev div{position:relative}.prev img{width:92px;height:64px;object-fit:cover;border-radius:4px;background:#000;display:block}
.prev button{position:absolute;top:2px;right:2px;padding:0 7px;font-size:15px;line-height:20px;background:#000c;border-color:#000}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.dirty{color:#ffc857;font-size:12px;font-weight:700}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.mbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow:auto}.mbox button{margin-top:6px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d1d21;border:1px solid var(--line);padding:10px 16px;border-radius:8px;max-width:90vw;z-index:9;display:none}
#toast.err{border-color:var(--red-fill);color:#ff9aa2}
.small{font-size:13px;color:var(--muted)}
.kind-ev{border-left:4px solid var(--green-fill)}.kind-pv{border-left:4px solid var(--red-fill)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow"><img src="site/media/logo-pv.png" alt=""><img src="site/media/logo-ev.png" alt=""><div><b id="who">Admin panel</b><small>Showroom &middot; Offers &middot; Cars &middot; Accessories</small></div></div>
    <div class="hbtns"><span id="dirty" class="dirty"></span> <a class="btn sm" href="site/index.html" target="_blank">View website</a> <button class="pri sm" id="pub">Publish changes</button></div>
  </header>
  <p class="small" style="margin:-6px 0 14px">Private page. It works only on this computer, and customers can never see it.</p>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<script src="site/meta.js"></script>
<script src="site/showroom.js"></script>
<script src="site/site-data.js"></script>
<script>
"use strict";
const META = window.META || {cats:[], cars:[]};
const CATS = META.cats && META.cats.length ? META.cats : ["Kits & Packs","Exterior & Style","Interior & Comfort","Protection & Security","Tech & Electricals","Paint Protection","Care & Lifestyle"];
const $ = s => document.querySelector(s), main = $("#main");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let toastT; function toast(m, err){ const t = $("#toast"); t.textContent = m; t.className = err ? "err" : ""; t.style.display = "block"; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = "none", err ? 6000 : 2600); }

/* ---------- data lives in this browser until you press Publish ---------- */
let D = {offers:[], cars:[], items:[], settings:[], nextNum:1};
let FILES = {};            /* new photos / PDFs, path -> Blob */
let dirty = false;
const OURL = {};
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(16).slice(2) + Date.now());
function vu(p){ if (!p) return ""; if (FILES[p]) return OURL[p] || (OURL[p] = URL.createObjectURL(FILES[p])); if (/^uploads\//.test(p)) return "site/" + p; return p; }
const idb = () => new Promise((res, rej) => { const r = indexedDB.open("mm-admin", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function idbGet(k){ const db = await idb(); return new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
function badge(){ const b = $("#dirty"); if (b) b.textContent = dirty ? "Unpublished changes" : ""; }
async function persist(){ dirty = true; badge(); try { await idbPut("state", {D, FILES, dirty}); } catch(e) {} }
function fromSiteData(){
  const sd = window.SITEDATA || {};
  D = {offers:sd.offers || [], cars:sd.cars || [], items:sd.items || [], settings:sd.settings || [], nextNum:sd.nextNum || 1};
  D.nextNum = Math.max(D.nextNum, 1 + Math.max(0, ...D.items.map(x => x.num || 0)));
  FILES = {}; dirty = false;
}
async function initData(){
  try { const st = await idbGet("state"); if (st && st.D) { D = st.D; FILES = st.FILES || {}; dirty = !!st.dirty; return; } } catch(e) {}
  fromSiteData();
}
async function rest(method, path, body, prefer){
  const [t, qs] = path.split("?"); const q = new URLSearchParams(qs || ""); if (!Array.isArray(D[t])) throw new Error("Unknown table " + t);
  const match = r => { for (const [k, v] of q) { if (k === "select" || k === "order" || k === "on_conflict") continue; const m = v.match(/^eq\.(.*)$/); if (m && String(r[k]) !== m[1]) return false; } return true; };
  if (method === "GET") { let rows = D[t].filter(match); const o = q.get("order"); if (o) { const [c, d] = o.split("."); rows = rows.slice().sort((a, b) => (a[c] > b[c] ? 1 : a[c] < b[c] ? -1 : 0) * (d === "desc" ? -1 : 1)); } return JSON.parse(JSON.stringify(rows)); }
  if (method === "POST") {
    if (q.get("on_conflict")) { const c = q.get("on_conflict"), i = D[t].findIndex(r => r[c] === body[c]); if (i >= 0) D[t][i] = body; else D[t].push(body); await persist(); return [body]; }
    const r = Object.assign({id:uid(), created_at:new Date().toISOString(), active:true}, body); if (t === "items") r.num = D.nextNum++; D[t].push(r); await persist(); return [r];
  }
  if (method === "PATCH") { const hit = D[t].filter(match); hit.forEach(r => Object.assign(r, body)); await persist(); return JSON.parse(JSON.stringify(hit)); }
  if (method === "DELETE") { D[t] = D[t].filter(r => !match(r)); await persist(); return []; }
}
async function getSetting(k){ const r = D.settings.find(x => x.key === k); return r ? r.value : null; }
async function setSetting(k, v){ await rest("POST", "settings?on_conflict=key", {key:k, value:v}); }
const getHidden = async () => { const h = (await getSetting("hidden")) || {}; return {ids:h.ids || [], cars:h.cars || []}; };
const loadCarFile = key => new Promise(res => { if (window.CARDATA && window.CARDATA[key]) return res(window.CARDATA[key]); const sc = document.createElement("script"); sc.src = "site/car-" + key + ".js"; sc.onload = () => res((window.CARDATA || {})[key] || []); sc.onerror = () => res([]); document.head.appendChild(sc); });
async function upload(blob, folder, ext){
  const path = "uploads/" + folder + "-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "." + ext;
  FILES[path] = blob; await persist(); return path;
}
/* shrink phone photos before saving so pages stay fast */
async function shrink(file, maxW, q){
  const bmp = await createImageBitmap(file);
  const sc = Math.min(1, maxW / Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * sc); cv.height = Math.round(bmp.height * sc);
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  let b = await new Promise(r => cv.toBlob(r, "image/webp", q));
  if (!b || b.type !== "image/webp") { b = await new Promise(r => cv.toBlob(r, "image/jpeg", q)); }
  return {blob:b, ext:b.type === "image/webp" ? "webp" : "jpg"};
}
async function uploadImage(file, folder, maxW){ const s = await shrink(file, maxW || 1400, .82); return upload(s.blob, folder, s.ext); }
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
const ymd = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fmt = s => { if (!s) return ""; const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d).toLocaleDateString("en-IN", {day:"numeric", month:"short", year:"numeric"}); };
const busy = (b, on) => { if (b) { b.disabled = on; if (on) { b.dataset.t = b.textContent; b.textContent = "Saving…"; } else if (b.dataset.t) b.textContent = b.dataset.t; } };

/* ---------- app shell ---------- */
let tab = "offers";
function shell(){
  badge();
  main.innerHTML = `<div class="tabs" id="tabs">
    <button data-t="offers" aria-pressed="${tab==="offers"}">Offers</button>
    <button data-t="shop" aria-pressed="${tab==="shop"}">Showroom</button>
    <button data-t="cars" aria-pressed="${tab==="cars"}">New cars</button>
    <button data-t="items" aria-pressed="${tab==="items"}">Accessories</button></div><div id="view"></div>`;
  $("#tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { tab = b.dataset.t; shell(); } };
  ({offers:offersView, shop:shopView, cars:carsView, items:itemsView})[tab]().catch(err => { toast(err.message, true); });
}

/* preview helpers for image pickers */
function picker(id, multi){ return `<input type="file" id="${id}" accept="image/*" ${multi ? "multiple" : ""}><div class="prev" id="${id}-p"></div>`; }

/* ================= OFFERS ================= */
async function offersView(){
  const v = $("#view"); v.innerHTML = '<p class="hint">Loading…</p>';
  const rows = await rest("GET", "offers?select=*&order=created_at.desc");
  const today = ymd(new Date());
  const st = o => !o.active ? ["hid","Hidden"] : o.starts_at > today ? ["sched","Scheduled"] : (o.ends_at && o.ends_at < today) ? ["exp","Expired"] : ["live","Live"];
  v.innerHTML = `<h2>Offers</h2><p class="hint">Offers appear at the top of the home page between the start and end dates, and disappear by themselves afterwards.</p>
    <div class="actions" style="margin:0 0 14px"><button class="pri" id="newO">+ New offer</button></div><div id="form"></div>
    ${rows.length ? rows.map(o => { const [c,l] = st(o); return `<div class="card item" data-id="${o.id}">
      ${o.image_url ? `<img src="${esc(vu(o.image_url))}" alt="">` : ""}
      <div class="mid"><div class="t">${esc(o.title)}</div><div class="s"><span class="chip ${c}">${l}</span>${fmt(o.starts_at)}${o.ends_at ? " → " + fmt(o.ends_at) : " → no end date"}${o.pdf_url ? " · PDF attached" : ""}</div></div>
      <button class="sm" data-a="edit">Edit</button><button class="sm" data-a="tog">${o.active ? "Hide" : "Show"}</button><button class="sm danger" data-a="del">Delete</button></div>`; }).join("") : '<p class="hint">No offers yet. Tap “New offer”.</p>'}`;
  $("#newO").onclick = () => offerForm(null);
  v.onclick = async e => {
    const b = e.target.closest("[data-a]"); if (!b) return; const id = b.closest("[data-id]").dataset.id, o = rows.find(x => x.id === id);
    try {
      if (b.dataset.a === "edit") offerForm(o);
      if (b.dataset.a === "tog") { await rest("PATCH", "offers?id=eq." + id, {active:!o.active}); toast("Updated"); offersView(); }
      if (b.dataset.a === "del" && confirm("Delete this offer?")) { await rest("DELETE", "offers?id=eq." + id); toast("Deleted"); offersView(); }
    } catch(err) { toast(err.message, true); }
  };
}
function offerForm(o){
  const f = $("#form"); let img = o && o.image_url || "", pdf = o && o.pdf_url || "";
  f.innerHTML = `<div class="card"><h3>${o ? "Edit offer" : "New offer"}</h3>
    <label>Heading *</label><input type="text" id="o_t" maxlength="90" placeholder="e.g. Diwali Special – Free Car Perfume" value="${esc(o ? o.title : "")}">
    <label>Details (optional)</label><textarea id="o_b" placeholder="Short text shown under the heading">${esc(o ? o.body : "")}</textarea>
    <label>Creative / poster image (optional)</label>${picker("o_i")}
    <label>Offer PDF (optional)</label><input type="file" id="o_f" accept="application/pdf"><div class="small" id="o_fp">${pdf ? "A PDF is attached. Choose a new one to replace it." : ""}</div>
    <div class="row"><div><label>Starts on</label><input type="date" id="o_s" value="${o ? o.starts_at : ymd(new Date())}"></div>
    <div><label>Ends on (last day shown)</label><input type="date" id="o_e" value="${o && o.ends_at ? o.ends_at : ""}"></div></div>
    <label><input type="checkbox" id="o_a" ${!o || o.active ? "checked" : ""}> Show this offer</label>
    <div class="actions"><button class="pri" id="o_save">Save offer</button><button id="o_x">Cancel</button></div></div>`;
  const draw = () => { $("#o_i-p").innerHTML = img ? `<div><img src="${esc(vu(img))}" alt=""><button data-x>×</button></div>` : ""; };
  draw(); $("#o_i-p").onclick = e => { if (e.target.closest("[data-x]")) { img = ""; draw(); } };
  $("#o_x").onclick = () => f.innerHTML = ""; f.scrollIntoView({behavior:"smooth"});
  $("#o_save").onclick = async e => {
    const b = e.currentTarget, title = $("#o_t").value.trim(); if (!title) return toast("Please add a heading", true);
    const s = $("#o_s").value, en = $("#o_e").value; if (!s) return toast("Choose a start date", true); if (en && en < s) return toast("End date is before the start date", true);
    busy(b, true);
    try {
      const fi = $("#o_i").files[0]; if (fi) img = await uploadImage(fi, "offers", 1400);
      const fp = $("#o_f").files[0]; if (fp) { if (fp.size > 15e6) throw new Error("PDF is too big (max 15 MB)"); pdf = await upload(fp, "offers", "pdf"); }
      const row = {title, body:$("#o_b").value.trim(), image_url:img || null, pdf_url:pdf || null, starts_at:s, ends_at:en || null, active:$("#o_a").checked};
      if (o) await rest("PATCH", "offers?id=eq." + o.id, row); else await rest("POST", "offers", row);
      toast("Offer saved"); offersView();
    } catch(err) { toast(err.message, true); busy(b, false); }
  };
}

/* ================= SHOWROOM DETAILS ================= */
async function shopView(){
  const v = $("#view"); v.innerHTML = '<p class="hint">Loading…</p>';
  const d = (await getSetting("shop")) || {};
  const def = window.SHOP || {};
  const g = k => d[k] != null ? d[k] : def[k];
  const phones = (g("phones") || []).join("\n"), br = (g("branches") || []).map(b => b.name + " | " + (b.map || "")).join("\n");
  v.innerHTML = `<h2>Showroom details</h2><p class="hint">Shown in the top-right of every page and in the “Visit us” section at the bottom.</p>
    <div class="card"><label>Showroom name</label><input type="text" id="s_n" value="${esc(g("name") || "")}">
    <label>Line under the name</label><input type="text" id="s_t" value="${esc(g("tagline") || "")}" placeholder="e.g. A Unit of Arnav Automobiles">
    <label>Phone numbers (one per line)</label><textarea id="s_p" style="min-height:70px">${esc(phones)}</textarea>
    <label>Locations (one per line: Name | Google Maps link)</label><textarea id="s_b" placeholder="Thane | https://maps.app.goo.gl/...">${esc(br)}</textarea>
    <p class="small">Open the place in Google Maps, tap Share, copy the link and paste it after the “|”.</p>
    <div class="actions"><button class="pri" id="s_save">Save details</button></div></div>`;
  $("#s_save").onclick = async e => {
    const b = e.currentTarget; busy(b, true);
    try {
      const lines = t => t.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const val = {name:$("#s_n").value.trim(), tagline:$("#s_t").value.trim(), phones:lines($("#s_p").value),
        branches:lines($("#s_b").value).map(l => { const p = l.split("|"); return {name:p[0].trim(), map:(p.slice(1).join("|") || "").trim()}; }).filter(x => x.name)};
      if (!val.name) throw new Error("Showroom name can't be empty");
      await setSetting("shop", val); toast("Saved. The website updates within a minute.");
    } catch(err) { toast(err.message, true); } finally { busy(b, false); }
  };
}

/* ================= CARS ================= */
async function carsView(){
  const v = $("#view"); v.innerHTML = '<p class="hint">Loading…</p>';
  const rows = await rest("GET", "cars?select=*&order=created_at.desc");
  const hid = await getHidden();
  v.innerHTML = `<h2>New cars</h2><p class="hint">Add a newly launched car here, then add its accessories in the Accessories tab. It appears under Electric or Petrol &amp; Diesel on the website.</p>
    <div class="actions" style="margin:0 0 14px"><button class="pri" id="newC">+ Add a car</button></div><div id="form"></div>
    ${rows.length ? rows.map(c => `<div class="card item kind-${c.kind}" data-id="${c.id}">
      ${c.hero_url ? `<img src="${esc(vu(c.hero_url))}" alt="">` : ""}<div class="mid"><div class="t">${esc(c.name)}</div><div class="s">${c.kind === "ev" ? "Electric" : "Petrol & Diesel"} · ${esc(c.tag || "")}${c.active ? "" : " · Hidden"}</div></div>
      <button class="sm" data-a="edit">Edit</button><button class="sm" data-a="tog">${c.active ? "Hide" : "Show"}</button><button class="sm danger" data-a="del">Delete</button></div>`).join("") : '<p class="hint">No new cars added yet.</p>'}
    <h3 style="margin-top:26px">Cars already on the website</h3><p class="hint">Hide a car you no longer sell. You can show it again any time.</p>
    ${(META.cars || []).map(c => `<div class="card item kind-${c.kind}" data-ex="${esc(c.key)}"><div class="mid"><div class="t">${esc(c.name)}</div><div class="s">${c.kind === "ev" ? "Electric" : "Petrol & Diesel"}${hid.cars.includes(c.key) ? " · Hidden" : ""}</div></div><button class="sm" data-h="1">${hid.cars.includes(c.key) ? "Show" : "Hide"}</button></div>`).join("")}`;
  $("#newC").onclick = () => carForm(null, rows);
  v.onclick = async e => {
    const hb = e.target.closest("[data-h]");
    if (hb) { const k = hb.closest("[data-ex]").dataset.ex; try { const h = await getHidden(); h.cars = h.cars.includes(k) ? h.cars.filter(x => x !== k) : h.cars.concat(k); await setSetting("hidden", h); toast("Updated"); carsView(); } catch(err) { toast(err.message, true); } return; }
    const b = e.target.closest("[data-a]"); if (!b) return; const id = b.closest("[data-id]").dataset.id, c = rows.find(x => x.id === id);
    try {
      if (b.dataset.a === "edit") carForm(c, rows);
      if (b.dataset.a === "tog") { await rest("PATCH", "cars?id=eq." + id, {active:!c.active}); carsView(); }
      if (b.dataset.a === "del" && confirm("Delete " + c.name + " and all its accessories added here?")) { await rest("DELETE", "items?car_key=eq." + c.key); await rest("DELETE", "cars?id=eq." + id); toast("Deleted"); carsView(); }
    } catch(err) { toast(err.message, true); }
  };
}
function carForm(c, rows){
  const f = $("#form"); let hero = c && c.hero_url || "";
  f.innerHTML = `<div class="card"><h3>${c ? "Edit car" : "Add a car"}</h3>
    <label>Car name *</label><input type="text" id="c_n" maxlength="40" placeholder="e.g. XUV 7XO" value="${esc(c ? c.name : "")}">
    <label>Type *</label><select id="c_k"><option value="pv" ${c && c.kind === "pv" ? "selected" : ""}>Petrol &amp; Diesel (PV)</option><option value="ev" ${c && c.kind === "ev" ? "selected" : ""}>Electric (EV)</option></select>
    <label>Short line (optional)</label><input type="text" id="c_t" maxlength="40" placeholder="e.g. 7-seat SUV" value="${esc(c ? c.tag : "")}">
    <label>Car photo *</label>${picker("c_i")}<p class="small">Use a clear side or three-quarter view of the car on a plain or dark background.</p>
    <div class="actions"><button class="pri" id="c_save">Save car</button><button id="c_x">Cancel</button></div></div>`;
  const draw = () => { $("#c_i-p").innerHTML = hero ? `<div><img src="${esc(vu(hero))}" alt=""><button data-x>×</button></div>` : ""; };
  draw(); $("#c_i-p").onclick = e => { if (e.target.closest("[data-x]")) { hero = ""; draw(); } };
  $("#c_x").onclick = () => f.innerHTML = ""; f.scrollIntoView({behavior:"smooth"});
  $("#c_save").onclick = async e => {
    const b = e.currentTarget, name = $("#c_n").value.trim(); if (!name) return toast("Enter the car name", true);
    busy(b, true);
    try {
      const fi = $("#c_i").files[0]; if (fi) hero = await uploadImage(fi, "cars", 900);
      if (!hero) throw new Error("Please add a car photo");
      const row = {name, kind:$("#c_k").value, tag:$("#c_t").value.trim(), hero_url:hero};
      if (c) await rest("PATCH", "cars?id=eq." + c.id, row);
      else {
        let key = slug(name) || "car"; const taken = new Set([...(META.cars || []).map(x => x.key), ...rows.map(x => x.key)]);
        if (taken.has(key)) { let n = 2; while (taken.has(key + "_" + n)) n++; key += "_" + n; }
        await rest("POST", "cars", Object.assign({key}, row));
      }
      toast("Car saved"); carsView();
    } catch(err) { toast(err.message, true); busy(b, false); }
  };
}

/* ================= ACCESSORIES ================= */
let curCar = "";
async function itemsView(){
  const v = $("#view"); v.innerHTML = '<p class="hint">Loading…</p>';
  const cloudCars = await rest("GET", "cars?select=*&order=created_at");
  const all = [...(META.cars || []).map(c => ({key:c.key, name:c.name, kind:c.kind, own:false})), ...cloudCars.map(c => ({key:c.key, name:c.name, kind:c.kind, own:true}))];
  if (!curCar || !all.some(c => c.key === curCar)) curCar = (cloudCars[0] || all[0] || {}).key || "";
  const opt = k => all.filter(c => c.kind === k).map(c => `<option value="${esc(c.key)}" ${c.key === curCar ? "selected" : ""}>${esc(c.name)}${c.own ? " (new)" : ""}</option>`).join("");
  const rows = curCar ? await rest("GET", "items?select=*&car_key=eq." + encodeURIComponent(curCar) + "&order=num.desc") : [];
  const car = all.find(c => c.key === curCar) || {};
  v.innerHTML = `<h2>Accessories</h2><p class="hint">Add new accessories to any car, or hide ones you no longer offer.</p>
    <label>Car</label><select id="carSel"><optgroup label="Petrol &amp; Diesel">${opt("pv")}</optgroup><optgroup label="Electric">${opt("ev")}</optgroup></select>
    <div class="actions" style="margin:12px 0 14px"><button class="pri" id="newI" ${curCar ? "" : "disabled"}>+ Add accessory to ${esc(car.name || "…")}</button></div><div id="form"></div>
    ${rows.length ? rows.map(i => `<div class="card item" data-id="${i.id}">${(i.images || [])[0] ? `<img src="${esc(vu(i.images[0]))}" alt="">` : ""}
      <div class="mid"><div class="t">${esc(i.title)}</div><div class="s">${esc(i.cat)}${i.active ? "" : " · Hidden"}</div></div>
      <button class="sm" data-a="edit">Edit</button><button class="sm" data-a="tog">${i.active ? "Hide" : "Show"}</button><button class="sm danger" data-a="del">Delete</button></div>`).join("") : `<p class="hint">Nothing added here for ${esc(car.name || "this car")} yet.</p>`}`;
  $("#carSel").onchange = e => { curCar = e.target.value; itemsView(); };
  if (!car.own && META.cars && META.cars.some(c => c.key === curCar)) origList(v, curCar);
  $("#newI").onclick = () => itemForm(null);
  v.onclick = async e => {
    const b = e.target.closest("[data-a]"); if (!b) return; const id = b.closest("[data-id]").dataset.id, it = rows.find(x => x.id === id);
    try {
      if (b.dataset.a === "edit") itemForm(it);
      if (b.dataset.a === "tog") { await rest("PATCH", "items?id=eq." + id, {active:!it.active}); itemsView(); }
      if (b.dataset.a === "del" && confirm("Delete this accessory?")) { await rest("DELETE", "items?id=eq." + id); toast("Deleted"); itemsView(); }
    } catch(err) { toast(err.message, true); }
  };
}
async function origList(v, key){
  const box = document.createElement("div"); box.innerHTML = '<h3 style="margin-top:26px">Original catalogue items</h3><p class="hint">Hide any accessory you no longer offer. Hidden items disappear from the website; you can show them again.</p><input type="text" id="oq" placeholder="Search…" style="margin-bottom:10px"><div id="ol"><p class="hint">Loading…</p></div>';
  v.appendChild(box);
  const [list, hid] = await Promise.all([loadCarFile(key), getHidden()]);
  const draw = () => { const q = ($("#oq").value || "").toLowerCase(); $("#ol").innerHTML = list.filter(i => !q || (i.title + " " + i.cat).toLowerCase().includes(q)).map(i => { const h = hid.ids.includes(i.id); const im = i.imgs && i.imgs[0] ? ((window.IMGS || {})[i.imgs[0]] || i.imgs[0]) : "";
    return `<div class="card item" data-oid="${esc(i.id)}">${im ? `<img src="${esc(im)}" alt="">` : ""}<div class="mid"><div class="t">${esc(i.title)}</div><div class="s">${esc(i.cat)}${h ? " · Hidden" : ""}</div></div><button class="sm ${h ? "" : "danger"}">${h ? "Show" : "Hide"}</button></div>`; }).join("") || '<p class="hint">Nothing found.</p>'; };
  draw(); $("#oq").oninput = draw;
  $("#ol").onclick = async e => { const b = e.target.closest("button"); if (!b) return; const id = b.closest("[data-oid]").dataset.oid;
    try { const h = await getHidden(); h.ids = h.ids.includes(id) ? h.ids.filter(x => x !== id) : h.ids.concat(id); await setSetting("hidden", h); hid.ids = h.ids; draw(); } catch(err) { toast(err.message, true); } };
}
function itemForm(it){
  const f = $("#form"); let imgs = (it && it.images) ? it.images.slice() : [];
  f.innerHTML = `<div class="card"><h3>${it ? "Edit accessory" : "New accessory"}</h3>
    <label>Name *</label><input type="text" id="i_t" maxlength="100" placeholder="e.g. Door Visor – Chrome" value="${esc(it ? it.title : "")}">
    <label>Category *</label><select id="i_c">${CATS.map(c => `<option ${it && it.cat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
    <label>Features (one per line)</label><textarea id="i_f">${esc(it ? it.features : "")}</textarea>
    <label>Advantages (one per line, optional)</label><textarea id="i_a">${esc(it ? it.advantages : "")}</textarea>
    <label>Part numbers (optional)</label><textarea id="i_p" placeholder="One per line:&#10;AW61040 | Body Cover – Silver | All variants">${esc(it ? it.parts : "")}</textarea>
    <p class="small">Format: part number | description | fits (the last part is optional).</p>
    <label>Note (optional)</label><textarea id="i_n" style="min-height:60px">${esc(it ? it.notes : "")}</textarea>
    <label>Photos (up to 6)</label>${picker("i_i", true)}
    <label><input type="checkbox" id="i_a2" ${!it || it.active ? "checked" : ""}> Show on website</label>
    <div class="actions"><button class="pri" id="i_save">Save accessory</button><button id="i_x">Cancel</button></div></div>`;
  const draw = () => { $("#i_i-p").innerHTML = imgs.map((u, k) => `<div><img src="${esc(vu(u))}" alt=""><button data-x="${k}">×</button></div>`).join(""); };
  draw(); $("#i_i-p").onclick = e => { const x = e.target.closest("[data-x]"); if (x) { imgs.splice(+x.dataset.x, 1); draw(); } };
  $("#i_x").onclick = () => f.innerHTML = ""; f.scrollIntoView({behavior:"smooth"});
  $("#i_save").onclick = async e => {
    const b = e.currentTarget, title = $("#i_t").value.trim(); if (!title) return toast("Enter the accessory name", true);
    busy(b, true);
    try {
      for (const file of [...$("#i_i").files]) { if (imgs.length >= 6) break; imgs.push(await uploadImage(file, "items", 1200)); }
      const row = {car_key:curCar, cat:$("#i_c").value, title, features:$("#i_f").value.trim(), advantages:$("#i_a").value.trim(), parts:$("#i_p").value.trim(), notes:$("#i_n").value.trim(), images:imgs, active:$("#i_a2").checked};
      if (it) await rest("PATCH", "items?id=eq." + it.id, row); else await rest("POST", "items", row);
      toast("Accessory saved"); itemsView();
    } catch(err) { toast(err.message, true); busy(b, false); }
  };
}

/* ---------- publish ---------- */
const usedPaths = () => { const u = new Set(); D.offers.forEach(o => { u.add(o.image_url); u.add(o.pdf_url); }); D.cars.forEach(c => u.add(c.hero_url)); D.items.forEach(i => (i.images || []).forEach(x => u.add(x))); return [...u].filter(p => p && FILES[p]); };
const siteDataText = () => "/* Written by the admin page. Do not edit by hand. */\nwindow.SITEDATA = " + JSON.stringify({offers:D.offers, cars:D.cars, items:D.items, settings:D.settings, nextNum:D.nextNum}, null, 1) + ";\n";
const CRC = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return u8 => { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = t[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }; })();
function makeZip(entries){
  const enc = new TextEncoder(), parts = [], central = []; let off = 0; const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const e of entries) {
    const name = enc.encode(e.name), crc = CRC(e.data), sz = e.data.length;
    const h = new DataView(new ArrayBuffer(30)); h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true); h.setUint16(10, time, true); h.setUint16(12, date, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(h.buffer, name, e.data);
    const c = new DataView(new ArrayBuffer(46)); c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true); c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, crc, true); c.setUint32(20, sz, true); c.setUint32(24, sz, true); c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(c.buffer, name); off += 30 + name.length + sz;
  }
  const csz = central.reduce((a, b) => a + (b.byteLength || b.length), 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true); end.setUint32(12, csz, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, end.buffer], {type:"application/zip"});
}
async function buildEntries(){
  const enc = new TextEncoder(), out = [{name:"site-data.js", data:enc.encode(siteDataText())}];
  for (const p of usedPaths()) out.push({name:p, data:new Uint8Array(await FILES[p].arrayBuffer())});
  return out;
}
function modal(html){ let m = $("#modal"); if (!m) { m = document.createElement("div"); m.id = "modal"; document.body.appendChild(m); } m.innerHTML = '<div class="mbox">' + html + '</div>'; m.style.display = "flex"; m.onclick = e => { if (e.target === m) m.style.display = "none"; }; return m; }
function publishDialog(){
  const m = modal(`<h3>Publish your changes</h3>
    <p class="hint">This saves your changes into the <b>site</b> folder. Then upload that folder to Vercel or Netlify again and customers will see everything.</p>
    ${window.showDirectoryPicker ? '<button class="pri" id="pf">1. Save into my “site” folder</button><p class="small">Choose the folder named <b>site</b> next to this admin file. Allow editing when your browser asks.</p>' : ""}
    <button id="pz" style="margin-top:6px">${window.showDirectoryPicker ? "Or download as a zip" : "Download update (zip)"}</button>
    <p class="small">The zip contains <b>site-data.js</b> and an <b>uploads</b> folder. Unzip it into your <b>site</b> folder and choose “Replace” if asked.</p>
    <hr style="border:0;border-top:1px solid var(--line);margin:14px 0"><button class="sm danger" id="pr">Discard my unpublished changes</button> <button class="sm" id="pc">Close</button>`);
  $("#pc").onclick = () => m.style.display = "none";
  $("#pz").onclick = async () => { try { const blob = makeZip(await buildEntries()), a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "site-update.zip"; document.body.appendChild(a); a.click(); a.remove(); dirty = false; badge(); await idbPut("state", {D, FILES, dirty}); toast("Zip downloaded"); } catch(err) { toast(err.message, true); } };
  if ($("#pf")) $("#pf").onclick = async () => {
    try {
      const dir = await window.showDirectoryPicker({mode:"readwrite"});
      try { await dir.getFileHandle("index.html"); } catch(e) { throw new Error("That is not the site folder. Pick the folder that contains index.html."); }
      const wr = async (h, data) => { const w = await h.createWritable(); await w.write(data); await w.close(); };
      await wr(await dir.getFileHandle("site-data.js", {create:true}), siteDataText());
      const up = await dir.getDirectoryHandle("uploads", {create:true});
      for (const p of usedPaths()) await wr(await up.getFileHandle(p.split("/").pop(), {create:true}), FILES[p]);
      dirty = false; badge(); await idbPut("state", {D, FILES, dirty});
      m.style.display = "none"; modal('<h3>Saved ✔</h3><p class="hint">Your changes are saved in the site folder. Now upload the <b>site</b> folder to Vercel (or Netlify) again. After it finishes, the website shows your changes.</p><button class="pri" onclick="document.getElementById(\'modal\').style.display=\'none\'">Done</button>');
    } catch(err) { if (err.name !== "AbortError") toast(err.message, true); }
  };
  $("#pr").onclick = async () => { if (!confirm("Throw away everything you changed since the last publish?")) return; try { await idbPut("state", null); } catch(e) {} fromSiteData(); m.style.display = "none"; shell(); toast("Back to the published version"); };
}
$("#pub").onclick = publishDialog;
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
(async () => { await initData(); shell(); })();
</script>
